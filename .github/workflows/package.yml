name: Package all images and deploy to pre-prod
run-name: ${{ github.workflow }} (`${{ inputs.VERSION }}`@${{ inputs.ENVIRONMENT }})

on:
  # Called from release orchestrator
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'The version to build (e.g. `5.4.1`)'
        required: true
      RELEASE_TYPE:
        description: 'What should be built'
        required: true
        type: choice
        options:
          - ALL
          - OSS
          - EE
      ENVIRONMENT:
        description: 'Environment to use'
        required: true
        type: environment

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.VERSION }}

      - name: Update `SNAPSHOT` to release version
        run: |
          mvn \
            versions:set \
            --batch-mode \
            --no-transfer-progress \
            --quiet \
            -DgenerateBackupPoms=false \
            -DnewVersion=${VERSION}

      - name: Commit
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git commit --all --message "Upgrade version to \`${VERSION}\`"
          git push

  package:
    needs: update-version
    uses: ./.github/workflows/publish-packages.yml
    with:
      VERSION: ${{ inputs.VERSION }}
      RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
      ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
    secrets: inherit
